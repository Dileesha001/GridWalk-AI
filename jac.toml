[project]
name = "gridwalk-ai"
version = "0.1.0"
description = "Jac microgrid recovery decision-support simulator"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.13"

[dependencies]
python-dotenv = ">=1.0,<2"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
"@tanstack/react-form" = "^1.33.5"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[client]

[client.app_meta_data]
title = "GridWalk AI · Recovery console"
description = "Fictional microgrid recovery console with inspectable fixed display snapshots."
theme_color = "#102b30"
icon = "data:,"
